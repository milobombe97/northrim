# Deploy to Vercel on every push to master (or main).
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN      — from https://vercel.com/account/tokens
#   VERCEL_ORG_ID     — Vercel project → Settings → General
#   VERCEL_PROJECT_ID — same page
#
# Also set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Vercel project
# Environment Variables (Production), not only in local .env.

name: Deploy to Vercel

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Deploy production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
